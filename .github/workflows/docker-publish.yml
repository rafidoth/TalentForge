name: Build and Push Backend Docker Image
on:
  push:
    branches:
      - main
    paths:
      - 'server/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "TAG=1.0${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t rafidoth/talent_forge:${{ steps.vars.outputs.TAG }} .

      - name: Push image
        run: docker push rafidoth/talent_forge:${{ steps.vars.outputs.TAG }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            # Stop and remove all running containers
            docker ps -q | xargs -r docker stop
            docker ps -aq | xargs -r docker rm

            # Pull the newly built image
            docker pull rafidoth/talent_forge:1.0${{ github.run_number }}

            # Run the new container
            docker run -d \
              --env-file .env 
              --name talent_forge \
              --restart unless-stopped \
              -p 8080:8080 \
              rafidoth/talent_forge:1.0${{ github.run_number }}
